# Builds and tests StreamLite for Windows and Linux on every push. Linux is the same program (src/, with the Linux
# system layer in linux/mono) built for Mono into one installer for every distro, installed and started on five
# distros here. A version tag (v4.1.3) also publishes the GitHub release (MSI, zip, the Linux .sh) with
# SHA256SUMS.txt - which StreamLite's updater checks every download against.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Version numbers agree
        run: |
          # One program for both systems: its version is the release's.
          win=$(sed -n 's/.*AssemblyFileVersion("\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' src/Program.cs)
          tag="$win"
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="${GITHUB_REF_NAME#v}"; fi
          echo "StreamLite $win, tag $tag"
          # A release whose program reports another version would make the updater install it again and again.
          if [ "$tag" != "$win" ]; then echo "::error::Version numbers differ"; exit 1; fi
          echo "version=$win" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build and run the offline tests
        shell: powershell
        run: |
          .\build.ps1
          $out = .\test\all.ps1 -Skip DfnChainTest,DfnBufferTest,LowVramTest,VoiceLockTest,FarVoiceTest,VoiceSetupTest,TeleprompterTest | Out-String
          $out
          if ($out -notmatch 'ALL PASSED') { exit 1 }
      - name: Build the MSI
        shell: powershell
        run: .\packaging\windows\build-msi.ps1 -Version ${{ needs.version.outputs.version }}
      - name: Validate the MSI
        shell: powershell
        run: |
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" msi validate "dist\StreamLite-${{ needs.version.outputs.version }}-x64.msi"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install the MSI on a clean Windows (prerequisites included, nothing waiting for a click)
        shell: powershell
        run: |
          $msi = (Resolve-Path "dist\StreamLite-${{ needs.version.outputs.version }}-x64.msi").Path
          $t = [Diagnostics.Stopwatch]::StartNew()
          $before = @{}; Get-Process | ForEach-Object { $before[$_.Id] = 1 }
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v `"$env:RUNNER_TEMP\msi.log`"" -PassThru
          $windows = @{}
          while (-not $p.HasExited -and $t.Elapsed.TotalMinutes -lt 15) {
            # Only windows of programs the install started (the runner's own terminal doesn't count).
            Get-Process | Where-Object { $_.MainWindowTitle -and -not $before.ContainsKey($_.Id) -and $_.ProcessName -ne 'msiexec' } | ForEach-Object { $windows[$_.ProcessName + ': ' + $_.MainWindowTitle] = 1 }
            Start-Sleep -Seconds 2
          }
          if (-not $p.HasExited) { Stop-Process $p -Force; Write-Error "The install hung for 15 minutes (a window waiting for a click?)"; }
          "msiexec exit code $($p.ExitCode) after $([int]$t.Elapsed.TotalSeconds) s"
          Get-Content "$env:ProgramData\StreamLite\prerequisites.log" -ErrorAction SilentlyContinue
          if ($windows.Count) { "Windows that appeared during the install:"; $windows.Keys }
          $ok = $p.HasExited -and $p.ExitCode -eq 0
          foreach ($s in 'VBAudioVACMME', 'VBAudioHFVAIOMME') { if (-not (Test-Path "HKLM:\SYSTEM\CurrentControlSet\Services\$s")) { "MISSING: driver service $s"; $ok = $false } }
          if (-not (Test-Path "$env:ProgramFiles\EqualizerAPO")) {
            # SourceForge refuses cloud runners (403); on a real PC the same download works and is checked against
            # SourceForge's published SHA-256. Anything else is a real failure.
            if (Select-String -Path "$env:ProgramData\StreamLite\prerequisites.log" -Pattern 'Equalizer APO.*\(403\) Forbidden' -Quiet) { "NOTE: Equalizer APO not tested here - SourceForge blocks GitHub's runners (403)" }
            else { "MISSING: Equalizer APO"; $ok = $false }
          }
          if (-not (Test-Path "$env:ProgramFiles\StreamLite\StreamLite.exe")) { "MISSING: StreamLite"; $ok = $false }
          if ($windows.Count) { $ok = $false }
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\msi.log" -Tail 60; exit 1 }
      - name: Quiet uninstall (asks nothing, keeps the drivers, never hangs)
        shell: powershell
        run: |
          $msi = (Resolve-Path "dist\StreamLite-${{ needs.version.outputs.version }}-x64.msi").Path
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /l*v `"$env:RUNNER_TEMP\msi-x.log`"" -PassThru
          if (-not $p.WaitForExit(300000)) { Stop-Process $p -Force; Get-Content "$env:RUNNER_TEMP\msi-x.log" -Tail 60; Write-Error "The quiet uninstall hung (a question waiting for a click?)"; exit 1 }
          "msiexec /x exit code $($p.ExitCode)"
          $ok = $p.ExitCode -eq 0
          if (Test-Path "$env:ProgramFiles\StreamLite\StreamLite.exe") { "StreamLite is still installed"; $ok = $false }
          foreach ($s in 'VBAudioVACMME', 'VBAudioHFVAIOMME') { if (-not (Test-Path "HKLM:\SYSTEM\CurrentControlSet\Services\$s")) { "A quiet uninstall removed the driver $s (it should keep it)"; $ok = $false } }
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\msi-x.log" -Tail 60; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.msi

  linux:
    needs: version
    # The Linux program is compiled with the .NET Framework compiler that comes with Windows (Mono runs it).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Linux installer
        shell: powershell
        run: .\packaging\linux\make-installer.ps1 -Version ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*-linux.sh

  install-test:
    needs: [version, linux]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu-24.04, image: "ubuntu:24.04", prep: "apt-get update && apt-get install -y sudo" }
          - { distro: debian-12, image: "debian:12", prep: "apt-get update && apt-get install -y sudo" }
          - { distro: fedora-41, image: "fedora:41", prep: "dnf install -y sudo" }
          - { distro: opensuse-tumbleweed, image: "opensuse/tumbleweed", prep: "zypper --non-interactive install sudo" }
          - { distro: arch, image: "archlinux:latest", prep: "pacman -Syu --noconfirm sudo" }
    container: ${{ matrix.image }}
    name: install (${{ matrix.distro }})
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - name: Install with the one installer (what it needs from the distro too)
        shell: bash
        run: |
          set -e
          ${{ matrix.prep }}
          bash "dist/StreamLite-${VER}-linux.sh" --system --no-start
      - name: Run it
        shell: bash
        run: |
          set -e
          streamlite --version | grep -q "StreamLite ${VER}"
          dir=$(sed -n 's/^APP="\(.*\)"$/\1/p' "$(command -v streamlite)" | head -n1)
          echo "installed in $dir ($(cat "$dir/install-kind.txt"))"
          for t in mono pactl ffmpeg v4l2-ctl; do command -v "$t" >/dev/null || { echo "::error::$t wasn't installed"; exit 1; }; done
          test -f /usr/share/applications/streamlite.desktop
          test -f "$dir/ai/libonnxruntime.so" && test -f "$dir/ai/deepfilternet3.onnx" && ls "$dir/hrtf"/*.blh >/dev/null

  release:
    needs: [version, windows, linux, install-test]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.version.outputs.version }}
        run: |
          # Release notes: this version's section of CHANGELOG.md.
          awk -v v="## $VER" '$0 ~ "^## " { p = index($0, v) == 1 } p' CHANGELOG.md | tail -n +2 > notes.md
          # Credits: this version's section of CREDITS.md (generated from src/Credits.cs; every release must have one).
          awk -v v="## StreamLite $VER" '$0 ~ "^## " { p = ($0 == v) } p' CREDITS.md | tail -n +2 > credits.md
          grep -q '\*\*' credits.md || { echo "CREDITS.md has no section for $VER"; exit 1; }
          printf '\n## Credits\n\n' >> notes.md
          cat credits.md >> notes.md
          cat docs/release-footer.md >> notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "StreamLite $VER" --notes-file notes.md
          fi
